name: API CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'regalaya-api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'regalaya-api/**'

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.9'
  SONAR_PROJECT_KEY: regalaya-regalaya-api

jobs:
  # ============================================
  # Job 1: Build and Test
  # ============================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: regalaya_test
          POSTGRES_USER: regalaya
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('regalaya-api/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Get dependencies
        run: mvn -f regalaya-api/pom.xml dependency:go-offline -B

      - name: Build
        run: mvn -f regalaya-api/pom.xml clean package -B -DskipTests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: regalaya_test
          DB_USERNAME: regalaya
          DB_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-for-ci-minimum-256-bits-long-enough

      - name: Run Tests
        run: mvn -f regalaya-api/pom.xml test -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: regalaya_test
          DB_USERNAME: regalaya
          DB_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-for-ci-minimum-256-bits-long-enough

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: regalaya-api/target/surefire-reports/

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: regalaya-api/target/site/jacoco/

  # ============================================
  # Job 2: Code Quality (SonarQube)
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: SonarQube Scan
        run: |
          mvn -f regalaya-api/pom.xml sonar:sonar \
            -B \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportsPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.branch.name=${GITHUB_REF#refs/heads/}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: regalaya_test
          DB_USERNAME: regalaya
          DB_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-for-ci-minimum-256-bits-long-enough

  # ============================================
  # Job 3: Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        run: mvn -f regalaya-api/pom.xml org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: regalaya-api/target/dependency-check-report.html

  # ============================================
  # Job 4: Build Docker Image
  # ============================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/regalaya-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./regalaya-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 5: Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Implementar lógica de deploy (ECS, K8s, etc.)
          echo "Deployment completed!"
        env:
          DEPLOYMENT_TARGET: staging
