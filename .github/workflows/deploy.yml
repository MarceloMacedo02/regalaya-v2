name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - web

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Pre-deployment Checks
  # ============================================
  pre-deployment:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check-changes.outputs.can_deploy }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check-changes
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            # Verificar se está na branch main
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Production deploy only allowed from main branch"
              echo "can_deploy=false" >> $GITHUB_OUTPUT
            else
              echo "can_deploy=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "can_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Get changed files
        if: steps.check-changes.outputs.can_deploy == 'true'
        run: |
          echo "Changes detected, ready for deployment"

  # ============================================
  # Deploy API
  # ============================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.can_deploy == 'true' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'api')
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG=${{ github.sha }}
          
          docker build -t $REGISTRY/regalaya-api:$IMAGE_TAG ./regalaya-api
          docker push $REGISTRY/regalaya-api:$IMAGE_TAG
          
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            docker tag $REGISTRY/regalaya-api:$IMAGE_TAG $REGISTRY/regalaya-api:latest
            docker push $REGISTRY/regalaya-api:latest
          fi

      - name: Deploy to ECS
        run: |
          echo "Deploying to ECS..."
          # Implementar update do ECS service
          # aws ecs update-service --cluster regalaya-cluster --service regalaya-api --force-new-deployment
          echo "ECS deployment triggered"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          # Implementar wait para ECS deployment
          echo "Deployment completed"

  # ============================================
  # Deploy Web
  # ============================================
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.can_deploy == 'true' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'web')
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: regalaya-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: regalaya-web

      - name: Build
        run: npm run build
        working-directory: regalaya-web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Vercel (Production)
        if: github.event.inputs.environment == 'production'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./regalaya-web

      - name: Deploy to Vercel (Preview)
        if: github.event.inputs.environment == 'staging'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./regalaya-web

  # ============================================
  # Post-deployment Verification
  # ============================================
  post-deployment:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    if: always()
    
    steps:
      - name: Run Health Checks
        run: |
          echo "Running health checks..."
          
          if [[ "${{ github.event.inputs.service }}" == "all" || "${{ github.event.inputs.service }}" == "api" ]]; then
            curl -f https://api.${{ github.event.inputs.environment }}.regalaya.com.br/actuator/health || exit 1
          fi
          
          if [[ "${{ github.event.inputs.service }}" == "all" || "${{ github.event.inputs.service }}" == "web" ]]; then
            curl -f https://${{ github.event.inputs.environment }}.regalaya.com.br || exit 1
          fi
          
          echo "All health checks passed!"

      - name: Notify Success
        if: needs.post-deployment.result == 'success'
        run: |
          echo "Deployment to ${{ github.event.inputs.environment }} completed successfully!"

      - name: Notify Failure
        if: needs.post-deployment.result == 'failure'
        run: |
          echo "Deployment failed! Please check the logs."
          exit 1
