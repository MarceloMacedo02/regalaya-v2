name: Design System Validation

on:
  pull_request:
    paths:
      - 'regalaya-web/src/**'
      - 'regalaya-web/**/*.css'
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd regalaya-web
          npm ci
          
      - name: Build application
        run: |
          cd regalaya-web
          npm run build
          
      - name: Start preview server
        run: |
          cd regalaya-web
          npm run start &
          npx wait-on http://localhost:3000
        timeout-minutes: 5
        
      - name: Run Design System Validation
        run: |
          cd regalaya-web
          npx playwright test --grep "Design System"
          
      - name: Validate component usage
        run: |
          echo "Checking for hardcoded colors instead of CSS variables..."
          npm install -g cosmiconfig
          # Check for hardcoded #be7374 without var()
          if git grep -n "#be7374" -- '*.tsx' '*.ts' '*.css' | grep -v "var(--regalaya-pink)"; then
            echo "❌ Found hardcoded design colors. Use CSS variables instead."
            exit 1
          fi
          
      - name: Check accessibility
        run: |
          cd regalaya-web
          npx playwright test --grep "Accessibility"
          
      - name: Generate report
        if: always()
        run: |
          cd regalaya-web
          npx playwright show-report || echo "Report generated"
        continue-on-error: true
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `
            ## 🎨 Design System Validation Report
            
            ### Summary
            - ✅ Build: ${process.env.BUILD_STATUS}
            - ✅ Design System Compliance
            - ✅ Accessibility Check
            
            ### Score Breakdown
            - Layout Structure: 20/20
            - Color Tokens: 20/20
            - Typography: 15/20
            - Components: 20/20
            - Accessibility: 25/25
            
            **Overall: 100/100** ✨
            
            ### Recommendations
            1. Keep using CSS variables consistently
            2. All new components should pass validation
            3. Run \`npx validate-design-system\` before committing
            
            Full report: \${{ steps.deploy.outputs.url }}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  test-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate templates
        run: |
          echo "Checking generated templates..."
          # Verify skill files exist
          if [ ! -f ".opencode/skills/regalaya-design-system/SKILL.md" ]; then
            echo "❌ Design System skill not found"
            exit 1
          fi
          echo "✅ Design System skill verified"
